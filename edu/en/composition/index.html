<!DOCTYPE html>
<html lang="en">
<head>
  <title>BOSTAFLIX - English Composition</title>
  <link rel="shortcut icon" href="https://bostaflix.vercel.app/favicon.ico" type="image/x-icon">

  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      overflow-x: hidden;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f0f0f;
      color: #eaeaea;
      overflow-x: hidden;
    }

    /* --- Header --- */
    header {
      width: 100%;
      background-color: #570303;
      color: #fff;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #fff;
    }

    .logo {
      color: #fff;
      text-decoration: none;
      font-size: 1.5em;
      font-weight: bold;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .nav-links {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .nav-links a {
      color: #fff;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 6px;
      transition: background 0.3s ease;
      white-space: nowrap;
    }

    .nav-links a:hover {
      background-color: #b80000;
      color: #fff;
    }

    /* --- Page Title --- */
    #banner-text {
      width: 100%;
      background-color: #0f0f0f;
      color: #fff;
      text-align: center;
      font-size: clamp(22px, 3vw, 36px);
      font-weight: 900;
      line-height: 1.2;
      padding: 14px 15px;
      border-bottom: 2px solid #fff;

      /* Prevent long title from breaking layout */
      overflow-wrap: break-word;
      word-wrap: break-word;
    }

    /* --- Banner --- */
    .banner {
      width: 100%;
      aspect-ratio: 15 / 1;
      background: url('https://www.bangladeshguardian.com/static/media/eluctionweb%20bannerban.10e3bee92539dd4e259f.jpeg')
        center / cover no-repeat;
      border-bottom: 2px solid #fff;
    }

    /* --- Video Grid --- */
.video-grid {
  width: min(90vw, 1200px);
  margin: 0 auto;
  padding: 20px 0;

  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
}

.video-card {
  flex: 0 1 calc((100% - 60px) / 6);
  min-width: 150px;
  min-height: 70px;

  background-color: #570303;
  display: flex;
  align-items: center;
  justify-content: center;

  text-align: center;
  font-weight: bold;
  font-size: clamp(13px, 1.3vw, 17px);
  line-height: 1.2;

  border: 2px solid #fff;
  text-decoration: none;
  color: #fff;
  padding: 10px;

  overflow-wrap: anywhere;

  transition: background 0.3s ease, transform 0.3s ease;
}
    .video-card:hover {
      background-color: #ff3c3c;
      color: #fff;
      transform: translateY(-5px);
    }

    /* --- Footer --- */
    footer {
      width: 100%;
      color: #fff;
      background-color: rgba(0, 0, 0, 0.5);
      padding: 10px 15px;
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
      line-height: 1.4;
      overflow-wrap: break-word;
    }

    /* --- Tablet --- */
    @media (max-width: 1000px) {

      .nav-links {
        gap: 8px;
      }

      .nav-links a {
        padding: 6px 8px;
      }

      .video-grid {
        width: 90vw;
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    /* --- Mobile --- */
    @media (max-width: 768px) {

      header {
        padding: 10px 15px;
      }

      .nav-links {
        display: none;
      }

      #banner-text {
        font-size: clamp(20px, 6vw, 28px);
        padding: 10px 8px;
      }

      .banner {
        aspect-ratio: 9 / 1;
      }

 {
  .video-grid {
    width: 100%;
    padding: 15px;
    gap: 10px;
  }

  .video-card {
    flex: 0 1 calc((100% - 10px) / 2);
    min-width: 0;
    font-size: 15px;
  }

      footer {
        font-size: 13px;
      }
    }

    /* --- Very Small Phones --- */
    @media (max-width: 380px) {

      #banner-text {
        font-size: 20px;
      }

      .video-grid {
        padding: 10px;
        gap: 8px;
      }

      .video-card {
        min-height: 65px;
        font-size: 13px;
        padding: 6px;
      }
    }
  </style>
</head>

<body>

  <!-- Header -->
  <header>

    <a href="https://bostaflix.vercel.app/index.html" class="logo">
      BOSTAFLIX
    </a>

    <nav class="nav-links">
      <a href="https://bostaflix.vercel.app/sports.html">Sports</a>
      <a href="https://bostaflix.vercel.app/news.html">News</a>
      <a href="https://bostaflix.vercel.app/entertainment.html">Entertainment</a>
      <a href="https://bostaflix.vercel.app/movies.html">Movies</a>
      <a href="https://bostaflix.vercel.app/kids.html">Kids</a>
    </nav>

  </header>


  <!-- Page Title -->
  <div id="banner-text">
    English Second Paper Composition
  </div>


  <!-- Banner -->
  <div class="banner"></div>


  <!-- Automatically Generated Button Grid -->
  <div class="video-grid" id="buttonGrid"></div>


  <script>

    /*
      Add or remove titles here.
      Buttons and links are generated automatically.
    */

    const titles = [
      "Traffic Jam",
      "Tree Plantation",
      "Artificial Intelligence",
      "The Importance of Learning English"
    ];


    const buttonGrid = document.getElementById("buttonGrid");


    titles.forEach(title => {

      const button = document.createElement("a");

      // Button title
      button.textContent = title;

      // Button CSS
      button.className = "video-card";

      // TXT filename
      const fileName = title + ".txt";

      // Automatically generated link
      button.href =
        "https://bostaflix.vercel.app/edu/en/composition/read.html?id=" +
        encodeURIComponent(fileName);

      // Add button
      buttonGrid.appendChild(button);

    });

  </script>


  <!-- Footer -->
  <footer>
    &copy; Bostafull Live by Syed Ashraful Islam Mahbeer.
    Any embedded content on this site are collected from the internet and
    Bostafull Live is not connected with them.
    Wait up to 1 min to load, if not, change server.
  </footer>

</body>
</html>
