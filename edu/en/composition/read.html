BOSTAFLIX
</a>

<nav class="nav-links">

<a href="https://bostaflix.vercel.app/sports.html">Sports</a>

<a href="https://bostaflix.vercel.app/news.html">News</a>

<a href="https://bostaflix.vercel.app/entertainment.html">Entertainment</a>

<a href="https://bostaflix.vercel.app/movies.html">Movies</a>

<a href="https://bostaflix.vercel.app/kids.html">Kids</a>

</nav>

</header>


<div id="newsContainer">

<div class="headline" id="headline"></div>

<div class="content" id="content"></div>

</div>


<script>

async function fetchNews() {

  /*
   * Get filename from URL
   *
   * Example:
   * /xyz.txt
   */

  const path =
    window.location.pathname;

  let filename =
    path.substring(
      path.lastIndexOf('/') + 1
    );

  /*
   * Remove .txt
   *
   * xyz.txt -> xyz
   */

  const title =
    filename.replace(
      /\.txt$/i,
      ''
    );

  /*
   * Use filename as headline
   */

  document.getElementById(
    'headline'
  ).innerText = title;

  /*
   * Use filename as browser title
   */

  document.title =
    title || 'BOSTAFLIX News';

  /*
   * Fetch TXT file
   */

  try {

    const response =
      await fetch('/' + filename);

    if (!response.ok) {

      throw new Error(
        'TXT file not found'
      );

    }

    const text =
      await response.text();

    /*
     * Split text into paragraphs.
     *
     * Blank lines create
     * separate paragraphs.
     */

    const paragraphs =
      text
        .trim()
        .split(/\r?\n\s*\r?\n/);

    const contentElement =
      document.getElementById('content');

    contentElement.innerHTML = '';

    paragraphs.forEach(paragraph => {

      const p =
        document.createElement('p');

      p.innerText =
        paragraph
          .replace(/\r?\n/g, ' ')
          .trim();

      contentElement.appendChild(p);

    });

  } catch (error) {

    console.error(
      'Error loading TXT:',
      error
    );

    document.getElementById(
      'content'
    ).innerText =
      'লোড করা সম্ভব হয়নি।';

  }

}

fetchNews();

</script>

</body>

</html>
