<!DOCTYPE html>

<html lang="bn">

<head>

<meta charset="UTF-8">

<title>BOSTAFLIX News</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

* {
  box-sizing: border-box;
}

/* --- Global --- */

body {
  margin: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background-color: #0f0f0f;
  color: #eaeaea;
}

/* --- Header --- */

header {
  background-color: #570303;
  color: #fff;
  padding: 10px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 2px solid #fff;
}

.logo {
  color: #fff;
  text-decoration: none;
  font-size: 1.5em;
  font-weight: bold;
  letter-spacing: 0.5px;
}

.nav-links {
  display: flex;
  gap: 20px;
}

.nav-links a {
  color: #fff;
  text-decoration: none;
  padding: 6px 12px;
  border-radius: 6px;
  transition: background 0.3s ease;
}

.nav-links a:hover {
  background-color: #b80000;
  color: #fff;
}

@media (max-width: 720px) {

  .nav-links {
    display: none;
  }

}

/* --- Headline --- */

.headline {
  font-size: 24px;
  font-weight: bold;
  color: #fff;
  margin: 20px auto 10px;
  width: 90%;
  max-width: 120vh;
  padding: 10px 0;
}

/* --- Content --- */

.content {
  font-size: 16px;
  color: #fff;
  margin: 10px auto 40px;
  width: 90%;
  max-width: 120vh;
  padding: 10px 0;
  text-align: justify;
  line-height: 1.8;
}

.content p {
  margin: 0 0 15px;
}

</style>

</head>


<body>


<header>

<a
  href="https://bostaflix.vercel.app/index.html"
  class="logo"
>
  BOSTAFLIX
</a>

<nav class="nav-links">

<a href="https://bostaflix.vercel.app/sports.html">
  Sports
</a>

<a href="https://bostaflix.vercel.app/news.html">
  News
</a>

<a href="https://bostaflix.vercel.app/entertainment.html">
  Entertainment
</a>

<a href="https://bostaflix.vercel.app/movies.html">
  Movies
</a>

<a href="https://bostaflix.vercel.app/kids.html">
  Kids
</a>

</nav>

</header>


<div id="newsContainer">

  <div
    class="headline"
    id="headline"
  ></div>

  <div
    class="content"
    id="content"
  ></div>

</div>


<script>

async function fetchNews() {

  /*
   * Get the "id" parameter.
   *
   * Example:
   *
   * read.html?id=Artificial%20Intelligence.txt
   *
   * id =
   * Artificial Intelligence.txt
   */

  const urlParams =
    new URLSearchParams(
      window.location.search
    );

  const id =
    urlParams.get('id');


  /*
   * If no id was supplied
   */

  if (!id) {

    document.getElementById(
      'headline'
    ).innerText =
      'Article not found';

    document.getElementById(
      'content'
    ).innerText =
      'No article was specified.';

    return;

  }


  /*
   * URLSearchParams automatically
   * decodes %20 into spaces.
   *
   * Example:
   *
   * Artificial%20Intelligence.txt
   *
   * becomes:
   *
   * Artificial Intelligence.txt
   */

  const filename =
    id;


  /*
   * Remove .txt from filename
   *
   * Artificial Intelligence.txt
   *
   * becomes:
   *
   * Artificial Intelligence
   */

  const title =
    filename.replace(
      /\.txt$/i,
      ''
    );


  /*
   * Headline = filename
   */

  document.getElementById(
    'headline'
  ).innerText =
    title;


  /*
   * Browser tab title
   */

  document.title =
    title || 'BOSTAFLIX News';


  /*
   * Build TXT URL relative to read.html
   *
   * read.html is located at:
   *
   * /edu/en/composition/read.html
   *
   * Therefore:
   *
   * ./Artificial Intelligence.txt
   *
   * becomes:
   *
   * /edu/en/composition/Artificial%20Intelligence.txt
   */

  const txtUrl =
    './' + encodeURIComponent(filename);


  try {

    /*
     * Fetch the TXT file
     */

    const response =
      await fetch(txtUrl);


    /*
     * Check HTTP status
     */

    if (!response.ok) {

      throw new Error(
        'TXT file not found: ' +
        response.status
      );

    }


    /*
     * Read TXT as UTF-8
     */

    const text =
      await response.text();


    /*
     * Find content container
     */

    const contentElement =
      document.getElementById(
        'content'
      );


    /*
     * Clear old content
     */

    contentElement.innerHTML =
      '';


    /*
     * Remove unnecessary whitespace
     */

    const cleanText =
      text.trim();


    /*
     * If TXT is empty
     */

    if (!cleanText) {

      contentElement.innerText =
        'No content available.';

      return;

    }


    /*
     * Split article into paragraphs.
     *
     * A blank line creates a new paragraph.
     */

    const paragraphs =
      cleanText.split(
        /\r?\n\s*\r?\n/
      );


    /*
     * Display each paragraph
     */

    paragraphs.forEach(
      paragraph => {

        const p =
          document.createElement(
            'p'
          );


        /*
         * Join normal line breaks
         * inside a paragraph into spaces.
         */

        p.innerText =
          paragraph
            .replace(
              /\r?\n/g,
              ' '
            )
            .trim();


        contentElement.appendChild(
          p
        );

      }
    );


  } catch (error) {

    console.error(
      'Error loading TXT:',
      error
    );


    /*
     * Show error message
     */

    document.getElementById(
      'content'
    ).innerText =
      'সংবাদটি লোড করা সম্ভব হয়নি।';

  }

}


/*
 * Start
 */

fetchNews();

</script>


</body>

</html>
