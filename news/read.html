<!DOCTYPE html>

<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>BOSTAFLIX News</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f0f0f;
      color: #eaeaea;
    }

    /* Header */
    header {
      background-color: #570303;
      color: #fff;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #fff;
    }

    .logo {
      color: #fff;
      text-decoration: none;
      font-size: 1.5em;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .nav-links {
      display: flex;
      gap: 20px;
    }

    .nav-links a {
      color: #fff;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 6px;
      transition: background 0.3s ease;
    }

    .nav-links a:hover {
      background-color: #b80000;
      color: #fff;
    }

    @media (max-width: 720px) {
      .nav-links {
        display: none;
      }
    }

    /* Headline */
    .headline {
      font-size: 24px;
      font-weight: bold;
      color: #fff;
      margin: 20px auto 10px;
      width: 90%;
      max-width: 120vh;
      padding: 10px 0;
      line-height: 1.5;
    }

    /* Brief */
    .brief {
      font-size: 18px;
      color: #bbb;
      margin: 0 auto 10px;
      width: 90%;
      max-width: 120vh;
      padding: 0 0 10px;
      line-height: 1.7;
    }

    /* Content */
    .content {
      font-size: 16px;
      color: #fff;
      margin: 10px auto 40px;
      width: 90%;
      max-width: 120vh;
      padding: 10px 0;
      text-align: justify;
      line-height: 1.8;
    }

    .content p {
      margin-bottom: 15px;
    }

    /* Images */
    #newsImageContainer {
      width: 100%;
      display: flex;
      justify-content: center;
      margin: 20px 0;
    }

    #newsImage {
      max-width: 700px;
      width: 100%;
      height: auto;
      display: none;
    }
  </style>

</head>

<body>

  <header>
    <a
      href="https://bostaflix.vercel.app/index.html"
      class="logo"
    >
      BOSTAFLIX
    </a>

<nav class="nav-links">

  <!-- News Image -->

  <div id="newsImageContainer">
    <img id="newsImage" alt="News Image">
  </div>

  <!-- News Content -->

  <div id="newsContainer">

```
<!-- ContentHeading from JSON -->
<div class="headline" id="headline"></div>

<!-- ContentBrief from JSON -->
<div class="brief" id="brief"></div>

<!-- ContentDetails from JSON -->
<div class="content" id="content"></div>
```

  </div>

  <script>
    async function fetchNews() {

      const urlParams =
        new URLSearchParams(window.location.search);

      const type = urlParams.get('type');
      const id = urlParams.get('id');
      const imageParam = urlParams.get('image');

      if (!type || !id) {
        document.getElementById('headline').innerText =
          'সংবাদের তথ্য পাওয়া যায়নি।';
        return;
      }

      const apiUrl =
        `https://backoffice.channel24bd.tv/api/v2/content-details/${type}/${id}`;

      try {

        const response = await fetch(apiUrl);

        if (!response.ok) {
          throw new Error(
            `HTTP Error: ${response.status}`
          );
        }

        const data = await response.json();

        if (
          !data.contentDetails ||
          data.contentDetails.length === 0
        ) {
          throw new Error('No content found');
        }

        const news = data.contentDetails[0];

        /*
         * =========================
         * TITLE
         * =========================
         */

        const title =
          news.ContentHeading || '';

        document.getElementById('headline').innerText =
          title;

        /*
         * Browser tab title
         */

        document.title =
          title || 'BOSTAFLIX News';

        /*
         * =========================
         * BRIEF
         * =========================
         *
         * Show ContentBrief only here.
         * It will NOT be inserted into
         * ContentDetails.
         */

        const brief =
          news.ContentBrief || '';

        document.getElementById('brief').innerText =
          brief;

        /*
         * =========================
         * IMAGE
         * =========================
         */

        if (imageParam) {

          const imageUrl =
            `https://backoffice.channel24bd.tv/media/imgAll/${imageParam}`;

          const imgElement =
            document.getElementById('newsImage');

          imgElement.src = imageUrl;

          imgElement.style.display =
            'block';
        }

        /*
         * =========================
         * ARTICLE CONTENT
         * =========================
         */

        let rawHtml =
          news.ContentDetails || '';

        const parser =
          new DOMParser();

        const doc =
          parser.parseFromString(
            rawHtml,
            'text/html'
          );

        /*
         * Remove ALL iframes
         */

        doc.querySelectorAll('iframe').forEach(
          iframe => iframe.remove()
        );

        /*
         * Remove ALL anchor tags
         */

        doc.querySelectorAll('a').forEach(
          anchor => anchor.remove()
        );

        /*
         * Remove ALL images
         */

        doc.querySelectorAll('img').forEach(
          img => img.remove()
        );

        /*
         * Remove unnecessary paragraphs
         */

        doc.querySelectorAll('p').forEach(
          p => {

            const text =
              p.textContent.trim();

            if (
              text.startsWith('আরও পড়ুন:') ||
              text.includes(
                'সারাদিনের সর্বশেষ খবর পেতে গুগল প্লে স্টোর এবং অ্যাপল অ্যাপ স্টোর থেকে ডাউনলোড করুন চ্যানেল 24 অ্যাপ-'
              )
            ) {
              p.remove();
            }

          }
        );

        /*
         * Remove empty paragraphs
         */

        doc.querySelectorAll('p').forEach(
          p => {

            if (
              !p.textContent.trim() &&
              !p.querySelector('br')
            ) {
              p.remove();
            }

          }
        );

        /*
         * Display cleaned article
         */

        document.getElementById('content').innerHTML =
          doc.body.innerHTML;

      } catch (error) {

        console.error(
          'Error fetching news:',
          error
        );

        document.getElementById('headline').innerText =
          'সংবাদ লোড করতে সমস্যা হয়েছে।';

        document.getElementById('brief').innerText =
          '';

        document.getElementById('content').innerText =
          '';
      }
    }

    fetchNews();
  </script>

</body>
</html>
