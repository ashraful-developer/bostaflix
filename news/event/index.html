<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOSTAFLIX News</title>
  <style>
/* --- Global --- */
body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #0f0f0f;
    color: #eaeaea;
}

/* --- Header --- */
header {
    background-color: #570303;
    color: #fff;
    padding: 10px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid #fff;
}
    .banner{
        width:100%;
        aspect-ratio: 15 / 1;
        background:url('https://www.bangladeshguardian.com/static/media/eluctionweb%20bannerban.10e3bee92539dd4e259f.jpeg') center/cover no-repeat;
        border:2px solid #fff;
    }

.logo {
    color: #fff;
    text-decoration: none;
    font-size: 1.5em;
    font-weight: bold;
    letter-spacing: 0.5px;
}

.nav-links {
    display: flex;
    gap: 20px;
}

.nav-links a {
    color: #fff;
    text-decoration: none;
    padding: 6px 12px;
    border-radius: 6px;
    transition: background 0.3s ease;
}

.nav-links a:hover {
    background-color: #b80000;
    color: #fff;
}

    @media (max-width: 720px) {
      .nav-links { display: none; }
      .banner{
        aspect-ratio: 9 / 1;
    }
    }

    /* News Container */
    .news-container {
      display: flex;
      flex-wrap: wrap;
      padding: 10px;
      gap: 15px;
      justify-content: center;
    }

    /* News Card */
    .news-card {
      background: black;
      border-radius: 8px;
      border: 2px solid #fff;
      box-shadow: 0 2px 8px rgba(255, 60, 60, 0.15);
      width: 320px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s, background 0.2s;
    }

    .news-card:hover {
      transform: scale(1.01);
      background: #303030;
    }

    .news-image {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-bottom: 2px solid #fff;
    }

    .news-content {
      padding: 10px 15px;
    }

    .news-heading {
      font-size: 2em;
      font-weight: bold;
      margin: 0 0 8px;
      color: #fff;
    }

    /* Manual Scroll Logo Bar */
    .scroll-container {
      position: fixed;
      bottom: 0;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 10px;
      background: #111;
      z-index: 9999;
    }

    .scroll-wrapper {
      flex: 1;
      display: flex;
      overflow-x: auto;
      scroll-behavior: auto; /* we use JS smooth */
      gap: 25px;
      padding: 5px 0;
      scrollbar-width: none;
    }

    .scroll-wrapper::-webkit-scrollbar { display: none; }

    .logo img {
      height: 75px;
      width: auto;
      cursor: pointer;
      border-radius: 8px;
      transition: transform 0.25s;
    }

    .logo img:hover { transform: scale(1.12); }

    .scroll-btn {
      background: #222;
      color: white;
      border: none;
      font-size: 30px;
      padding: 8px 15px;
      border-radius: 10px;
      cursor: pointer;
      user-select: none;
      transition: background .3s;
    }

    .scroll-btn:hover { background: #444; }

    .left { margin-right: 5px; }
    .right { margin-left: 5px; }
  </style>
</head>

<body>

  <header>
    <a href="https://bostaflix.vercel.app/index.html" class="logo">BOSTAFLIX</a>
    <nav class="nav-links">
      <a href="https://bostaflix.vercel.app/sports.html">Sports</a>
      <a href="https://bostaflix.vercel.app/news.html">News</a>
      <a href="https://bostaflix.vercel.app/entertainment.html">Entertainment</a>
      <a href="https://bostaflix.vercel.app/movies.html">Movies</a>
      <a href="https://bostaflix.vercel.app/kids.html">Kids</a>
    </nav>
  </header>
  <!-- News Container -->
  <div class="news-container" id="news-container"></div>
  <!-- JavaScript -->
  <script>
    // ------------------------
    // Load News Cards
    // ------------------------
    const container = document.getElementById('news-container');
    const endpoints = [
      'https://backoffice.channel24bd.tv/api/json/file/generateSpecial1.json',
      'https://backoffice.channel24bd.tv/api/json/file/generateSpecial2.json',
      'https://backoffice.channel24bd.tv/api/json/file/generatePopular.json',
      'https://backoffice.channel24bd.tv/api/json/file/generateLatest.json',
    ];
    const seenNews = new Set();

    async function loadNews() {
      for (const url of endpoints) {
        try {
          const res = await fetch(url);
          const json = await res.json();
          json.data.forEach(item => {
            const uniqueKey = `${item.Slug}-${item.ContentID}`;
            if (seenNews.has(uniqueKey)) return;
            seenNews.add(uniqueKey);

            const link = `https://bostaflix.vercel.app/news/read.html?type=${item.Slug}&id=${item.ContentID}&image=${encodeURIComponent(item.ImageBgPath)}`;
            const imageUrl = `https://backoffice.channel24bd.tv/media/imgAll/${item.ImageBgPath}`;

            const card = document.createElement('a');
            card.className = 'news-card';
            card.href = link;
            card.innerHTML = `
              <img src="${imageUrl}" alt="${item.ContentHeading}" class="news-image">
              <div class="news-content">
                <h3 class="news-heading">${item.ContentHeading}</h3>
              </div>
            `;
            container.appendChild(card);
          });
        } catch (error) {
          console.error('Error loading:', url, error);
        }
      }
    }

    loadNews();
  </script>
</body>
</html>
